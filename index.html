<!doctype html>
<html lang="de"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>CyberMotion 3D – WD-04</title><link rel="stylesheet" href="./styles.css"/><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script></head>
<body>
<header class="topbar"><div class="brand">CyberMotion 3D <span>WD-04</span></div><div class="actions">
<button id="new-project">Neues Projekt</button><button id="add-box">Würfel</button><button id="add-sphere">Kugel</button><button id="add-cylinder">Zylinder</button><button id="group-selected">Gruppe</button><button id="assembly-selected">Baugruppe</button><button id="duplicate-object">Duplizieren</button><button id="delete-object">Löschen</button><button id="undo">Undo</button><button id="redo">Redo</button><button id="tool-move" class="active">Move</button><button id="tool-rotate">Rotate</button><button id="tool-scale">Scale</button><select id="project-select"><option value="">Gespeichertes Projekt wählen</option></select><button id="save-project">Speichern</button><button id="load-project">Laden</button><button id="delete-project">Speicher löschen</button>
</div></header>
<main class="workspace"><aside class="panel tree-panel"><h2>Objektbaum</h2><div class="muted selection-hint">Häkchen = Gruppenauswahl</div><div id="object-tree" class="object-tree"></div></aside><section class="viewport-panel"><div id="viewport" class="viewport"></div><div id="status" class="status">Bereit</div></section><aside class="panel inspector-panel"><h2>Inspector</h2><div id="inspector-empty" class="muted">Kein Objekt ausgewählt</div><form id="inspector" hidden>
<label>Name <input id="object-name" type="text"/></label><div class="id-box"><strong>Typ</strong><code id="object-type"></code></div>
<fieldset id="geometry-fields"><legend>Abmessungen (m)</legend><label id="dim-x-row">X <input id="dim-x" type="number" step="0.001" min="0.000001"/></label><label id="dim-y-row">Y <input id="dim-y" type="number" step="0.001" min="0.000001"/></label><label id="dim-z-row">Z <input id="dim-z" type="number" step="0.001" min="0.000001"/></label><label id="radius-row">Radius <input id="radius" type="number" step="0.001" min="0.000001"/></label><label id="height-row">Höhe <input id="height" type="number" step="0.001" min="0.000001"/></label></fieldset>
<fieldset><legend>Pivot / Origin (m)</legend><label>X <input id="pivot-x" type="number" step="0.001"/></label><label>Y <input id="pivot-y" type="number" step="0.001"/></label><label>Z <input id="pivot-z" type="number" step="0.001"/></label></fieldset>
<fieldset><legend>Position (m)</legend><label>X <input id="pos-x" type="number" step="0.001"/></label><label>Y <input id="pos-y" type="number" step="0.001"/></label><label>Z <input id="pos-z" type="number" step="0.001"/></label></fieldset>
<fieldset><legend>Rotation (°)</legend><label>X <input id="rot-x" type="number" step="1"/></label><label>Y <input id="rot-y" type="number" step="1"/></label><label>Z <input id="rot-z" type="number" step="1"/></label></fieldset>
<fieldset><legend>Scale</legend><label>X <input id="scale-x" type="number" step="0.1"/></label><label>Y <input id="scale-y" type="number" step="0.1"/></label><label>Z <input id="scale-z" type="number" step="0.1"/></label></fieldset>
<div class="id-box"><strong>objectId</strong><code id="object-id"></code></div></form></aside></main><script type="module" src="./src/main.js"></script></body></html>
