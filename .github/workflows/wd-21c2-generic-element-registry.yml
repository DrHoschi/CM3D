name: WD-21C.2 Generic Sketch Element Registry Regression

on:
  push:
    branches:
      - feature/wd-21c-sketch-element-type-expansion
    paths:
      - 'src/model/project.js'
      - 'src/model/sketch-topology.js'
      - 'src/main.js'
      - 'tests/wd-21a2-sketch-topology-contract.mjs'
      - 'tests/wd-21a3-sketch-mutation-contract.mjs'
      - 'tests/wd-21b2-endpoint-connect-contract.mjs'
      - 'tests/wd-21b3-endpoint-disconnect-contract.mjs'
      - 'tests/wd-21c2-generic-element-registry-persistence.mjs'
      - '.github/workflows/wd-21c2-generic-element-registry.yml'
  workflow_dispatch:

jobs:
  generic-element-registry-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run WD-21A.2 topology regression
        run: node tests/wd-21a2-sketch-topology-contract.mjs
      - name: Run WD-21A.3 mutation regression
        run: node tests/wd-21a3-sketch-mutation-contract.mjs
      - name: Run WD-21B.2 connect regression
        run: node tests/wd-21b2-endpoint-connect-contract.mjs
      - name: Run WD-21B.3 disconnect regression
        run: node tests/wd-21b3-endpoint-disconnect-contract.mjs
      - name: Run WD-21C.2 registry and persistence regression
        run: node tests/wd-21c2-generic-element-registry-persistence.mjs
