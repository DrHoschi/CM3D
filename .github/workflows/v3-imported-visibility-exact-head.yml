name: V3 Imported Visibility Exact-Head Verification

on:
  push:
    branches:
      - feature/v3-imported-element-visibility-overrides
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: V3 imported visibility override contract
        run: node tests/v3-imported-element-visibility-overrides.mjs
      - name: V3 imported structure regression
        run: node tests/v3-imported-structure-subselection.mjs
      - name: V2 GLTF regression
        run: node tests/wd-27a-central-export-workflow.mjs
      - name: V2 OBJ/STL interchange regression
        run: node tests/wd-27b-obj-stl-interchange.mjs
      - name: V2 selection hierarchy regression
        run: node tests/wd-25a-scene-hierarchy-parent-foundation.mjs
      - name: V2 object-tree regression
        run: node tests/wd-25c-object-tree-search-filter.mjs
