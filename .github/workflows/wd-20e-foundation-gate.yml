name: WD-20E Foundation Gate Regression

on:
  push:
    branches:
      - feature/wd-20e-foundation-integration-rb01-gate
    paths:
      - 'src/application/dependency-graph.js'
      - 'src/application/stable-reference.js'
      - 'src/application/extrude.js'
      - 'src/application/domain-transaction.js'
      - 'src/ui/inspector-diagnostics.js'
      - 'src/main.js'
      - 'tests/wd-20a-project-schema.mjs'
      - 'tests/wd-20b-selection-ref.mjs'
      - 'tests/wd-20c-stable-reference.mjs'
      - 'tests/wd-20d-dependency-graph.mjs'
      - 'tests/wd-20e-domain-transaction.mjs'
      - 'tests/wd-20e-reference-diagnostics.mjs'
      - '.github/workflows/wd-20e-foundation-gate.yml'
      - 'docs/05_implementation/WD-20E_STATUS.md'
  pull_request:
    paths:
      - 'src/application/dependency-graph.js'
      - 'src/application/stable-reference.js'
      - 'src/application/extrude.js'
      - 'src/application/domain-transaction.js'
      - 'src/ui/inspector-diagnostics.js'
      - 'src/main.js'
      - 'tests/wd-20a-project-schema.mjs'
      - 'tests/wd-20b-selection-ref.mjs'
      - 'tests/wd-20c-stable-reference.mjs'
      - 'tests/wd-20d-dependency-graph.mjs'
      - 'tests/wd-20e-domain-transaction.mjs'
      - 'tests/wd-20e-reference-diagnostics.mjs'
      - '.github/workflows/wd-20e-foundation-gate.yml'
      - 'docs/05_implementation/WD-20E_STATUS.md'

jobs:
  foundation-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/wd-20a-project-schema.mjs
      - run: node tests/wd-20b-selection-ref.mjs
      - run: node tests/wd-20c-stable-reference.mjs
      - run: node tests/wd-20d-dependency-graph.mjs
      - run: node tests/wd-20e-domain-transaction.mjs
      - run: node tests/wd-20e-reference-diagnostics.mjs
      - name: Reject stale WD-20E.3 runtime labels
        run: |
          if grep -RIn --include='*.js' 'WD-20E.3' src; then
            echo 'Stale WD-20E.3 runtime label found under src/.'
            exit 1
          fi
