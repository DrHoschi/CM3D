name: WD-26D Base Color Texture Foundation
on:
  push:
    branches: [feature/WD-26D-base-color-texture-foundation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exact head
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Syntax
        run: |
          node --check src/model/project.js
          node --check src/application/material.js
          node --check src/ui/material-panel.js
          node --check src/runtime-three/material-texture.js
          node --check tests/wd-26d-base-color-texture-foundation.mjs
      - name: WD-26A regression
        run: node tests/wd-26a-material-binding-local-variant-foundation.mjs
      - name: WD-26B regression
        run: node tests/wd-26b-material-assignment-removal.mjs
      - name: WD-26C regression
        run: node tests/wd-26c-pbr-numeric-properties.mjs
      - name: WD-26D focused regression
        run: node tests/wd-26d-base-color-texture-foundation.mjs
