name: V3 Imported Base-Color Texture Exact-Head Verification

on:
  push:
    branches:
      - feature/v3-imported-base-color-texture-replacement
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: V3 imported base-color texture replacement contract
        run: node tests/v3-imported-element-base-color-texture-replacement.mjs
      - name: V3 imported structure regression
        run: node tests/v3-imported-structure-subselection.mjs
      - name: V3 imported visibility regression
        run: node tests/v3-imported-element-visibility-overrides.mjs
      - name: V3 imported transform regression
        run: node tests/v3-imported-element-transform-overrides.mjs
      - name: V3 imported material parameter regression
        run: node tests/v3-imported-element-material-overrides.mjs
      - name: V2 base-color texture foundation regression
        run: node tests/wd-26d-base-color-texture-foundation.mjs
      - name: V2 GLTF export regression
        run: node tests/wd-27a-central-export-workflow.mjs
