name: WD-26J Shared Library Registry Runtime Authority
on:
  push:
    branches: [ feature/WD-26J-shared-library-registry-runtime-authority ]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exact head
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Syntax
        run: |
          node --check src/application/library-runtime.js
          node --check src/ui/material-panel.js
          node --check src/ui/sketch-library-panel.js
          node --check src/ui/object-library-panel.js
          node --check src/ui/assembly-library-panel.js
          node --check src/main.js
          node --check tests/wd-26j-shared-library-registry-runtime-authority.mjs
      - name: A10 registry regression
        run: node tests/wd-26e-library-registry-foundation.mjs
      - name: Material library regression
        run: node tests/wd-26f-material-presets-library.mjs
      - name: Sketch library regression
        run: node tests/wd-26g-sketch-template-independent-copy.mjs
      - name: Object library regression
        run: node tests/wd-26h-object-library-independent-copy.mjs
      - name: Assembly library regression
        run: node tests/wd-26i-assembly-library-independent-hierarchy-copy.mjs
      - name: WD-26J focused regression
        run: node tests/wd-26j-shared-library-registry-runtime-authority.mjs
