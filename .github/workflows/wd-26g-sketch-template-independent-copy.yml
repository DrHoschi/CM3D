name: WD-26G Sketch Template Independent Copy
on:
  push:
    branches: [feature/WD-26G-sketch-template-independent-copy]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exact head
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Syntax
        run: |
          node --check src/application/sketch-library.js
          node --check src/ui/sketch-library-panel.js
          node --check src/main.js
          node --check tests/wd-26g-sketch-template-independent-copy.mjs
      - name: A10 registry regression
        run: node tests/wd-26e-library-registry-foundation.mjs
      - name: Sketch topology regression
        run: node tests/wd-21a4-foundation-integration-gate.mjs
      - name: Profile/path identity regression
        run: node tests/wd-21g1-profile-path-save-reload-roundtrip.mjs
      - name: WD-26G focused regression
        run: node tests/wd-26g-sketch-template-independent-copy.mjs
