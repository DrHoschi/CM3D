name: WD-26A Material Binding Local Variant Foundation
on:
  push:
    branches: [feature/wd-26a-material-binding-local-variant-foundation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: |
          node --check src/application/material.js
          node --check src/model/project.js
          node --check tests/wd-26a-material-binding-local-variant-foundation.mjs
      - name: WD-25A regression
        run: node tests/wd-25a-scene-hierarchy-parent-foundation.mjs
      - name: WD-25B regression
        run: node tests/wd-25b-layers-foundation.mjs
      - name: WD-25C regression
        run: node tests/wd-25c-object-tree-search-filter.mjs
      - name: WD-25D regression
        run: node tests/wd-25d-performance-large-scene-instrumentation.mjs
      - name: WD-25E regression
        run: node tests/wd-25e-f089-large-world-small-objects-qa.mjs
      - name: WD-25F regression
        run: node tests/wd-25f-rb06-completion-recent-projects.mjs
      - name: WD-26A focused regression
        run: node tests/wd-26a-material-binding-local-variant-foundation.mjs
