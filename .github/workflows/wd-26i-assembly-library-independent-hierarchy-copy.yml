name: WD-26I Assembly Library Independent Hierarchy Copy
on:
  push:
    branches: [ feature/WD-26I-assembly-library-independent-hierarchy-copy ]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exact head
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Syntax
        run: |
          node --check src/application/assembly-library.js
          node --check src/ui/assembly-library-panel.js
          node --check src/main.js
          node --check tests/wd-26i-assembly-library-independent-hierarchy-copy.mjs
      - name: A10 registry regression
        run: node tests/wd-26e-library-registry-foundation.mjs
      - name: Object library regression
        run: node tests/wd-26h-object-library-independent-copy.mjs
      - name: Sketch library regression
        run: node tests/wd-26g-sketch-template-independent-copy.mjs
      - name: WD-26I focused regression
        run: node tests/wd-26i-assembly-library-independent-hierarchy-copy.mjs
