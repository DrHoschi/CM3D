name: WD-25C Object Tree Search Filter
on:
  push:
    branches: [feature/WD-25C-object-tree-search-filter]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: |
          node --check src/ui/object-tree-scalability.js
          node --check tests/wd-25c-object-tree-search-filter.mjs
      - name: WD-24A regression
        run: node tests/wd-24a-sequential-body-feature-output-foundation.mjs
      - name: WD-24B regression
        run: node tests/wd-24b-boolean-foundation.mjs
      - name: WD-24C regression
        run: node tests/wd-24c-bevel-fillet-foundation.mjs
      - name: WD-24D regression
        run: node tests/wd-24d-mirror-foundation.mjs
      - name: WD-24E regression
        run: node tests/wd-24e-pattern-foundation.mjs
      - name: WD-24F regression
        run: node tests/wd-24f-feature-dependency-structure.mjs
      - name: WD-24G regression
        run: node tests/wd-24g-f102-multi-edge-fillet-completion.mjs
      - name: WD-25A regression
        run: node tests/wd-25a-scene-hierarchy-parent-foundation.mjs
      - name: WD-25B regression
        run: node tests/wd-25b-layers-foundation.mjs
      - name: WD-25C focused regression
        run: node tests/wd-25c-object-tree-search-filter.mjs
